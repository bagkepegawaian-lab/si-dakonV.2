    <style>
      :root { 
        --tvk-blue: #004d40; 
        --tvk-accent: #ffb74d; 
        --tvk-bg: #f4f7f6; 
        --font-main: 'Poppins', sans-serif;
      }

      body { background-color: var(--tvk-bg); font-family: var(--font-main); margin: 0; color: #333; }

      #loader-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--tvk-accent); z-index: 9999; width: 0%; transition: 0.3s; }

      .top-nav { background: rgba(0, 0, 0, 0.2); padding: 10px 0; color: white; font-size: 0.85rem; position: absolute; width: 100%; z-index: 20; }
      .top-nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; opacity: 0.8; transition: 0.3s; }
      .top-nav a:hover { opacity: 1; color: var(--tvk-accent); }

      .hero-container { 
        background: linear-gradient(rgba(0, 77, 64, 0.85), rgba(0, 37, 31, 0.95)), 
                    url('https://uinsa.ac.id/wp-content/uploads/2023/08/Twin-Towers-UINSA.jpg');
        background-size: cover; 
        background-position: center;
        min-height: 500px; 
        padding-top: 80px; 
        color: white;
        clip-path: ellipse(150% 100% at 50% 0%);
        position: relative;
      }

      .brand-logo { font-size: 2rem; font-weight: 800; color: white; text-decoration: none; letter-spacing: -1px; }
      .brand-logo span { font-weight: 300; color: var(--tvk-accent); }

      .product-tabs { display: flex; justify-content: center; gap: 20px; margin-top: 60px; flex-wrap: wrap; }
      .tab-item { 
        cursor: pointer; padding: 20px; border-radius: 15px; transition: 0.4s; 
        text-align: center; width: 140px; color: rgba(255,255,255,0.8); 
        background: rgba(255,255,255,0.1); backdrop-filter: blur(5px);
        border: 1px solid rgba(255,255,255,0.1);
      }
      .tab-item i { font-size: 1.8rem; }
      .tab-item span { font-weight: 600; font-size: 0.9rem; margin-top: 10px; display: block; }
      .tab-item:hover { background: rgba(255,255,255,0.2); transform: translateY(-5px); color: white; }
      .tab-item.active { 
        background: white; color: var(--tvk-blue); 
        box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
        transform: translateY(-5px);
        border: 1px solid white;
      }

      .search-panel { 
        background: white; border-radius: 20px; padding: 35px; 
        box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
        margin-top: -80px; position: relative; z-index: 10; 
        border: 1px solid rgba(0,0,0,0.05);
      }

      .search-type-pill { 
        background: #e0f2f1; color: var(--tvk-blue); 
        padding: 6px 18px; border-radius: 20px; 
        font-size: 0.75rem; font-weight: 700; 
        display: inline-block; margin-bottom: 20px; 
        letter-spacing: 1px; text-transform: uppercase;
      }

      .input-group-custom { 
        border: 1px solid #e0e0e0; border-radius: 12px; 
        padding: 12px 18px; display: flex; align-items: center; gap: 15px; 
        transition: 0.3s;
      }
      .input-group-custom:focus-within { border-color: var(--tvk-blue); box-shadow: 0 0 0 3px rgba(0,77,100,0.1); }
      .input-group-custom i { color: var(--tvk-blue); font-size: 1.3rem; opacity: 0.7; }
      .input-group-custom label { display: block; font-size: 0.7rem; color: #888; margin: 0; font-weight: 700; text-transform: uppercase; }
      .input-group-custom input { border: none; width: 100%; outline: none; font-weight: 600; color: #333; font-size: 1rem; background: transparent; }

      .btn-search { 
        background: linear-gradient(135deg, var(--tvk-accent), #f57c00); 
        border: none; color: white; width: 100%; border-radius: 12px; height: 100%;
        font-size: 1.6rem; transition: 0.3s; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 20px rgba(255,183,77,0.3);
      }
      .btn-search:hover { transform: scale(1.03); }

      .stat-card { background: white; padding: 25px; border-radius: 15px; border: 1px solid #eaeaea; height: 100%; transition: 0.3s; }
      .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
      .stat-card p { color: #888; font-size: 0.9rem; font-weight: 500; margin-bottom: 5px; }
      .stat-card h3 { font-weight: 800; font-size: 2.5rem; margin: 0; letter-spacing: -1px; }

      .card-white { background: white; padding: 30px; border-radius: 15px; border: 1px solid #eaeaea; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
      .card-white h6 { font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--tvk-blue); margin-bottom: 25px; font-size: 0.85rem; }

      #unit-list { max-height: 280px; overflow-y: auto; padding-right: 10px; }
      #unit-list::-webkit-scrollbar { width: 5px; }
      #unit-list::-webkit-scrollbar-thumb { background: var(--tvk-blue); border-radius: 10px; }

      .table-responsive { border-radius: 15px; overflow-x: auto !important; }
      table.dataTable { border-collapse: collapse !important; width: 100% !important; }
      table.dataTable thead th { background: #f8f9fa; color: var(--tvk-blue); white-space: nowrap !important; padding: 15px !important; border-bottom: 2px solid #eee !important; }
      table.dataTable tbody td { white-space: nowrap !important; vertical-align: middle; padding: 12px 15px !important; }

      .text-link { color: var(--tvk-blue); cursor: pointer; font-weight: 600; text-decoration: none; transition: 0.3s; }
      .text-link:hover { color: var(--tvk-accent); text-decoration: underline; }

      .modal-form-header { background: var(--tvk-blue); color: white; padding: 1.5rem 2rem; flex-shrink: 0; }
      .modal-photo-sidebar { 
        width: 260px; background-color: #f8f9fa; padding: 30px; 
        border-right: 1px solid #eee; display: flex; flex-direction: column; 
        align-items: center; flex-shrink: 0;
      }
      .photo-main-preview { 
        width: 140px; height: 180px; border-radius: 15px; 
        object-fit: cover; border: 5px solid white; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 25px; 
        background-color: #eee;
      }
      .modal-split-layout { display: flex; min-height: 100%; }

      .home-section-title { font-size: 1.1rem; font-weight: 700; color: #000; margin-bottom: 15px; }
      .home-card { background: white; border-radius: 15px; padding: 25px; border: 1px solid #eee; height: 100%; }
      .text-muted-fw { color: #888; font-weight: 600; font-size: 0.85rem; }
      .total-big-number { font-size: 4rem; font-weight: 800; line-height: 1; color: var(--tvk-blue); margin: 10px 0; }
      .status-badge-active { background: #e8f5e9; color: #2e7d32; padding: 5px 15px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
      .status-badge-active::before { content:''; width: 8px; height: 8px; background: #2e7d32; border-radius: 50%; }
      .custom-progress { height: 8px; border-radius: 10px; background-color: #eee; overflow: hidden; }
      .pg-pns { background-color: #2e7d32; }
      .pg-pppk { background-color: #ffb74d; }
      .bg-soft-primary { background-color: rgba(0, 77, 64, 0.1) !important; color: #004d40 !important; font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; }

      /* DRH STYLES */
      .modal-drh-content { border-radius: 20px; overflow: hidden; border: none; }
      .drh-header-card { background: white; border-radius: 20px; padding: 25px; display: flex; gap: 30px; margin-bottom: 25px; border: 1px solid #eee; }
      .drh-avatar-wrapper { flex-shrink: 0; display: flex; flex-direction: column; gap: 15px; }
      .drh-avatar { width: 140px; height: 180px; object-fit: cover; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
      .drh-main-info { flex-grow: 1; }
      .drh-name-big { font-size: 1.8rem; font-weight: 800; color: var(--tvk-blue); margin-bottom: 5px; }
      .drh-nip-pill { background: #f0f0f0; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: #666; }
      .drh-info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 25px; }
      .drh-info-item { display: flex; align-items: center; gap: 12px; }
      .drh-info-icon { width: 35px; height: 35px; border-radius: 10px; background: #f4f7f6; display: flex; align-items: center; justify-content: center; color: var(--tvk-blue); }
      .drh-info-text label { display: block; font-size: 0.7rem; color: #999; font-weight: 700; text-transform: uppercase; margin: 0; }
      .drh-info-text span { font-weight: 600; font-size: 0.95rem; color: #333; }
      .status-badge-live { padding: 6px 15px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; border: 1px solid; }
      .drh-tabs-nav { display: flex; gap: 10px; border-bottom: 1px solid #eee; margin-bottom: 25px; }
      .drh-tab-btn { padding: 10px 20px; border: none; background: none; font-weight: 700; color: #999; border-bottom: 3px solid transparent; transition: 0.3s; }
      .drh-tab-btn.active { color: var(--tvk-blue); border-bottom-color: var(--tvk-blue); }
      .drh-section-card { background: #fff; border: 3px solid #eee; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
      .drh-section-title { font-weight: 800; color: var(--tvk-blue); margin-bottom: 15px; font-size: 0.9rem; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
      .drh-data-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
      .drh-field-group label { display: block; font-size: 0.7rem; color: #999; font-weight: 700; text-transform: uppercase; margin-bottom: 3px; }
      .drh-field-value { font-weight: 600; color: #333; font-size: 0.9rem; }

      @media (max-width: 768px) {
        .modal-split-layout { flex-direction: column; }
        .modal-photo-sidebar { width: 100%; border-right: none; border-bottom: 1px solid #eee; }
        .drh-header-card { flex-direction: column; align-items: center; text-align: center; }
        .drh-info-grid { grid-template-columns: 1fr; }
        .drh-data-grid { grid-template-columns: 1fr; }
      }

/* CSS WAJIB AGAR PROGRESS BAR MUNCUL */
.custom-progress {
    background-color: #eee; /* Warna abu-abu untuk sisa bar */

    height: 10px;           /* Memberi ketebalan agar bar kelihatan */
    width: 100%;
    margin-top: 8px;
    overflow: hidden;
    display: block;         /* Memastikan elemen tampil */
}

.progress-bar {
    height: 100%;
    border-radius: 10px;
    display: block;
    transition: width 0.6s ease; /* Animasi gerak */
}

  .custom-progress {
    background-color: #e9ecef !important; /* Warna abu-abu terang */

    margin-top: 10px;
